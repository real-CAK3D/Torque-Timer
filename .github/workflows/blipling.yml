name: Blipling Android build

on:
  push:
    branches: [ "claude/barcode-buddy-app-2dpfom" ]
    paths: [ "blipling/**", ".github/workflows/blipling.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blipling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: blipling
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BLIPLING_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "BLIPLING_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-dev" >> $GITHUB_ENV
          fi
          echo "BLIPLING_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Blipling-${BLIPLING_VERSION_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blipling-${{ env.BLIPLING_VERSION_NAME }}
          path: blipling/Blipling-*.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: blipling/Blipling-*.apk
          generate_release_notes: true
